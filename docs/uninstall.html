<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>We're sorry to see you go.</title>
<meta name="description" content="You've uninstalled Use Multiple Chat AI at Once. Tell us why — your feedback helps us improve.">
<meta name="theme-color" content="#4B3BD6">
<meta name="robots" content="noindex">
<link rel="icon" type="image/png" href="assets/logo.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="pages.css">
<style>
  /* Page-specific only — shared tokens/reset/body/logo/card-column live in pages.css. */
  header{ display:flex; flex-direction:column; align-items:center; gap:16px; text-align:center; }
  h1{
    font-size:clamp(28px, 5vw, 40px); line-height:1.1; color:var(--ink);
  }
</style>
</head>
<body>
  <div class="page">
    <header>
      <img class="logo" src="assets/logo.png" alt="Use Multiple Chat AI at Once">
      <h1>We're sorry to see you go.</h1>
    </header>

    <!-- Google Form embedded via iframe. `?embedded=true` renders the compact
         embed layout (no Google chrome). The form keeps Google's own styling;
         only the surrounding page is branded. -->
    <div class="card">
      <iframe
        class="form-frame"
        src="https://docs.google.com/forms/d/e/1FAIpQLSdUc-1w_TJ35KQHQ3FEzERgoZolSWINqYHRc1YxcJbOnSeWmA/viewform?embedded=true"
        title="Uninstall feedback form"
        loading="lazy">Loading…</iframe>
    </div>

    <div class="footer">
      <p id="reinstall" class="reinstall" hidden>
        <a id="reinstall-link" class="reinstall-btn" href="#">Reinstall from the Chrome Web Store</a>
      </p>
    </div>
  </div>

  <!-- Shared Metrika bootstrap: parses the fragment → window.PAGE_FRAGMENT,
       inits Yandex.Metrika (external page only; no extension code here). -->
  <script src="metrika.js"></script>

  <!-- Page-specific: build the reinstall link from the id the extension wrote. -->
  <script type="text/javascript">
    // Chrome Web Store detail base — mirrors WEBSTORE_DETAIL_URL_BASE in
    // shared/constants.js (buildWebstoreDetailUrl). The extension id is appended
    // as a path segment to build the "reinstall" link; works before publication.
    var WEBSTORE_DETAIL_URL_BASE = 'https://chromewebstore.google.com/detail';
    var REINSTALL_WRAP_ID = 'reinstall';
    var REINSTALL_LINK_ID = 'reinstall-link';
    var UNINSTALL_GOAL = 'uninstall_opened';   // MIRRORS UNINSTALL_METRIKA_GOAL (shared/constants.js)

    // Build the "reinstall" link from the id and reveal it. Missing id → stays
    // hidden (no broken link on a static, pre-publication page).
    var frag = window.PAGE_FRAGMENT || {};
    if (frag.id) {
      document.getElementById(REINSTALL_LINK_ID).href =
        WEBSTORE_DETAIL_URL_BASE + '/' + encodeURIComponent(frag.id);
      document.getElementById(REINSTALL_WRAP_ID).hidden = false;
    }

    // Rollup goal fired once per uninstall-page open (symmetric with welcome).
    // Per-locale breakdown comes from the locale/language visit params on the
    // same visit — no per-locale goals (there are 53 locales).
    if (window.Metrika) window.Metrika.reachGoals([{ goal: UNINSTALL_GOAL, params: {} }]);
  </script>
  <!-- noscript fallback pixel mirrors the Metrika counter id (110166603) -->
  <noscript><div><img src="https://mc.yandex.ru/watch/110166603" style="position:absolute; left:-9999px;" alt="" /></div></noscript>
</body>
</html>
