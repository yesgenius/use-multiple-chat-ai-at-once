<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Use Multiple Chat AI at Once — Installed</title>
<meta name="description" content="You've installed Use Multiple Chat AI at Once. Pin it to your toolbar in two clicks and chat with multiple AI models at the same time.">
<meta name="theme-color" content="#4B3BD6">
<link rel="icon" type="image/png" href="assets/logo.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
  :root{
    --accent:#4B3BD6;
    --accent2:#6E6CF0;
    --ink:#251f49;
    --muted:#6c6790;
    --bg:#faf9f5;
    /* --u is the live scale unit (= displayed width of one browser screenshot). Set by JS. */
    --u:620px;
  }
  *{ margin:0; padding:0; box-sizing:border-box; }
  html,body{ background:var(--bg); }
  body{
    font-family:'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, sans-serif;
    color:var(--ink);
    min-height:100vh;
    overflow-x:hidden;
    -webkit-font-smoothing:antialiased;
  }
  /* soft brand glows */
  body::before, body::after{
    content:""; position:fixed; width:42vmax; height:42vmax; border-radius:50%;
    pointer-events:none; z-index:0; filter:blur(2px);
  }
  body::before{ top:-16vmax; left:-12vmax; background:radial-gradient(circle, rgba(110,108,240,0.16), transparent 70%); }
  body::after{ bottom:-18vmax; right:-14vmax; background:radial-gradient(circle, rgba(75,59,214,0.13), transparent 70%); }

  .page{
    position:relative; z-index:1;
    width:100%; max-width:1480px; margin:0 auto;
    padding:calc(var(--u) * 0.026) 24px 0;
    display:flex; flex-direction:column; align-items:center;
    gap:calc(var(--u) * 0.03);
  }

  /* ---------- header (single compact row) ---------- */
  header{ display:flex; align-items:center; justify-content:center; gap:calc(var(--u) * 0.022); text-align:left; }
  .logo{
    flex:0 0 auto;
    width:calc(var(--u) * 0.072); height:calc(var(--u) * 0.072);
    border-radius:calc(var(--u) * 0.02);
    box-shadow:0 12px 30px -10px rgba(75,59,214,0.5); display:block;
  }
  .htext{ display:flex; flex-direction:column; align-items:flex-start; gap:calc(var(--u) * 0.008); }
  .badge{
    display:inline-flex; align-items:center; gap:calc(var(--u) * 0.011);
    padding:calc(var(--u) * 0.006) calc(var(--u) * 0.016) calc(var(--u) * 0.006) calc(var(--u) * 0.011);
    border-radius:999px; background:#fff; border:1px solid rgba(75,59,214,0.16);
    color:var(--accent); font-size:calc(var(--u) * 0.019); font-weight:600;
    box-shadow:0 2px 8px rgba(46,33,120,0.06); white-space:nowrap;
  }
  .badge svg{ width:calc(var(--u) * 0.023); height:calc(var(--u) * 0.023); }
  h1{
    font-size:calc(var(--u) * 0.044); line-height:1.06; font-weight:800; letter-spacing:-0.02em;
    white-space:nowrap;
  }
  h1 .nm{ color:var(--accent); }

  /* ---------- steps ---------- */
  .step{ width:100%; display:flex; flex-direction:column; align-items:center; gap:calc(var(--u) * 0.013); }
  .cap{
    display:flex; align-items:center; justify-content:center;
    gap:calc(var(--u) * 0.013); text-align:center; white-space:nowrap;
    max-width:calc(var(--u) * 1.08);
  }
  .lbl{
    flex:0 0 auto; font-size:calc(var(--u) * 0.018); font-weight:700; letter-spacing:0.07em;
    text-transform:uppercase; color:var(--accent); white-space:nowrap;
    background:rgba(75,59,214,0.09); border-radius:calc(var(--u) * 0.011);
    padding:calc(var(--u) * 0.006) calc(var(--u) * 0.013);
  }
  .cap p{ font-size:calc(var(--u) * 0.0235); line-height:1.35; color:var(--ink); font-weight:500; }
  .cap p b{ font-weight:700; color:var(--accent); }

  .frame{
    position:relative; width:var(--u); aspect-ratio:1593 / 815;
    border-radius:calc(var(--u) * 0.02); background:#fff;
    border:1px solid rgba(75,59,214,0.12);
    box-shadow:0 24px 60px -26px rgba(46,33,120,0.45), 0 6px 18px rgba(46,33,120,0.08);
    overflow:hidden;
  }
  .frame img{ display:block; width:100%; height:100%; object-fit:cover; }

  /* invisible marker pinned to the bottom of the red circles in screen 2.
     JS lines this up with the bottom of the viewport so only the circles peek. */
  #peekline{ position:absolute; left:0; right:0; top:23%; height:0; }

  /* ---------- footer ---------- */
  .footer{
    width:100%; max-width:calc(var(--u) * 1.05);
    display:flex; flex-direction:column; align-items:center; text-align:center;
    gap:calc(var(--u) * 0.014);
    padding:calc(var(--u) * 0.026) 0 calc(var(--u) * 0.06);
  }
  .footer .done{
    display:inline-flex; align-items:center; gap:calc(var(--u) * 0.012);
    font-size:calc(var(--u) * 0.028); font-weight:700; color:var(--accent); white-space:nowrap;
  }
  .footer .done svg{ width:calc(var(--u) * 0.032); height:calc(var(--u) * 0.032); }
  .footer p{ font-size:calc(var(--u) * 0.023); line-height:1.5; color:var(--muted); font-weight:500; max-width:32em; }

  /* On genuinely narrow screens, let captions/title wrap so nothing overflows. */
  @media (max-width: 560px){
    header{ flex-direction:column; text-align:center; }
    .htext{ align-items:center; }
    h1{ white-space:normal; text-align:center; }
    .cap{ white-space:normal; flex-wrap:wrap; }
  }
</style>
</head>
<body>
  <div class="page">
    <header>
      <img class="logo" src="assets/logo.png" alt="Use Multiple Chat AI at Once">
      <div class="htext">
        <span class="badge">
          <svg viewBox="0 0 16 16" fill="none"><circle cx="8" cy="8" r="8" fill="#22B07D"></circle><path d="M4.7 8.2l2.1 2.1 4.4-4.6" stroke="#fff" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"></path></svg>
          Successfully installed
        </span>
        <h1>Pin <span class="nm">Use Multiple Chat AI at Once</span></h1>
      </div>
    </header>

    <!-- SCREEN 1 — fully visible in the browser window -->
    <div class="step" id="step1">
      <div class="cap">
        <span class="lbl">Steps 1 &amp; 2</span>
        <p>Click the <b>puzzle-piece icon</b> (1), then click the <b>pin</b> (2).</p>
      </div>
      <div class="frame">
        <img src="assets/step12.png" alt="Open the extensions menu and pin Use Multiple Chat AI at Once">
      </div>
    </div>

    <!-- SCREEN 2 — only the red circles peek above the fold; scroll reveals the rest -->
    <div class="step" id="step2">
      <div class="cap">
        <span class="lbl">Step 3</span>
        <p>Now <b>click the icon</b> (3) to chat with every AI at once.</p>
      </div>
      <div class="frame">
        <div id="peekline"></div>
        <img src="assets/step3.png" alt="Click the pinned icon to start using the extension">
      </div>
    </div>

    <div class="footer">
      <span class="done">
        <svg viewBox="0 0 24 24" fill="none"><circle cx="12" cy="12" r="11" fill="#4B3BD6"></circle><path d="M7 12.4l3.2 3.2L17 8.8" stroke="#fff" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"></path></svg>
        You're all set
      </span>
      <p>That's it. Open any page, click the icon, and chat with multiple AI models side by side.</p>
    </div>
  </div>

  <script>
    var page = document.querySelector('.page');
    var marker = document.getElementById('peekline');
    var root = document.documentElement;

    var U_MAX = 1340;   // never enlarge a screenshot past this width

    function setU(u){ root.style.setProperty('--u', u + 'px'); }

    function fit(){
      var vw = window.__vw || window.innerWidth;
      var vh = window.innerHeight;
      var maxByW = Math.min(vw * 0.94, U_MAX);
      var step2 = document.getElementById('step2');

      // Goal: at ANY window proportion, the red circles of all three steps (1 & 2 on
      // screen 1, 3 on screen 2) are visible at once, with the content anchored to the
      // top — no downward shift, no artificial gap.

      // 1) Measure the layout's vertical scale constant K (marker pos is ~linear in --u).
      step2.style.marginTop = '0px';            // content always flows from the top
      setU(maxByW);
      var probeTop = marker.getBoundingClientRect().top + window.scrollY;
      var K = probeTop / maxByW;                 // marker doc-position per px of --u

      // 2) Largest --u that still keeps circle 3 (the marker) inside the viewport.
      //    Because u <= uForHeight, the marker is always <= vh, so circle 3 is always
      //    visible and screen 1 (circles 1 & 2) sits fully above it.
      //    - Wide window  -> height-bound: screen 1 is capped so circle 3 stays in view
      //                      (screen 2 shows only its top — the "fuse").
      //    - Narrow window -> width-bound: screens are smaller, so circle 3 lands higher
      //                      and screen 2 simply shows more, with no gap or shift.
      var uForHeight = (K > 0) ? (vh / K) : maxByW;
      var u = Math.min(maxByW, uForHeight);
      setU(u);
    }

    function schedule(){ requestAnimationFrame(fit); }
    window.addEventListener('resize', schedule);
    window.addEventListener('orientationchange', schedule);
    window.addEventListener('load', schedule);
    if (document.fonts && document.fonts.ready) document.fonts.ready.then(schedule);
    document.querySelectorAll('.frame img').forEach(function(img){
      if (!img.complete) img.addEventListener('load', schedule, { once:true });
    });
    fit();
  </script>
</body>
</html>
