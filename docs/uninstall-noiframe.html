<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>We're sorry to see you go. (noiframe test)</title>
<meta name="description" content="Black-box test variant of uninstall.html WITHOUT the Google-Form iframe.">
<meta name="theme-color" content="#4B3BD6">
<meta name="robots" content="noindex">
<link rel="icon" type="image/png" href="assets/logo.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="pages.css">
<style>
  header{ display:flex; flex-direction:column; align-items:center; gap:16px; text-align:center; }
  h1{ font-size:clamp(28px, 5vw, 40px); line-height:1.1; color:var(--ink); }
</style>
</head>
<body>
  <div class="page">
    <header>
      <img class="logo" src="assets/logo.png" alt="Use Multiple Chat AI at Once">
      <h1>We're sorry to see you go.</h1>
    </header>

    <!-- BLACK-BOX TEST: the Google-Form iframe is INTENTIONALLY ABSENT here.
         Everything else mirrors uninstall.html (same metrika.js, same goal). -->

    <div class="footer">
      <p id="reinstall" class="reinstall" hidden>
        <a id="reinstall-link" class="reinstall-btn" href="#">Reinstall from the Chrome Web Store</a>
      </p>
    </div>
  </div>

  <!-- Shared Metrika bootstrap (same file uninstall.html uses). -->
  <script src="metrika.js"></script>

  <script type="text/javascript">
    var WEBSTORE_DETAIL_URL_BASE = 'https://chromewebstore.google.com/detail';
    var REINSTALL_WRAP_ID = 'reinstall';
    var REINSTALL_LINK_ID = 'reinstall-link';
    var UNINSTALL_GOAL = 'uninstall_opened';

    var frag = window.PAGE_FRAGMENT || {};
    if (frag.id) {
      document.getElementById(REINSTALL_LINK_ID).href =
        WEBSTORE_DETAIL_URL_BASE + '/' + encodeURIComponent(frag.id);
      document.getElementById(REINSTALL_WRAP_ID).hidden = false;
    }

    if (window.Metrika) {
      window.Metrika.reachGoals([{ goal: UNINSTALL_GOAL, params: {} }]);
    }
  </script>
  <noscript><div><img src="https://mc.yandex.ru/watch/110166603" style="position:absolute; left:-9999px;" alt="" /></div></noscript>
</body>
</html>
